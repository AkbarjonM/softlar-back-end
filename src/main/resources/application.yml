spring:
  application:
    name: zon-crm
  datasource:
    url: jdbc:postgresql://localhost:5432/crm
    username: postgres
    password: admin
  jpa:
    hibernate:
      ddl-auto: update
      show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

logging:
  level:
    uz.zon.crm: DEBUG
